[project]
name = "prose-decorate"
version = "0.1.0"
description = "Markdown -> Fish s2-pro prosody-tagged text via Claude."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jonathan Moregard", email = "jonathan.more@hotmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "google-genai>=1.0",
    "markdown-it-py>=3.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
prose-decorate = "prose_decorate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prose_decorate"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
